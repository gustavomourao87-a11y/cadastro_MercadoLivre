<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Preencha os dados para criar sua conta</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
        <img src="img/logo.png" alt="Logo mercado livre">
        </header>
        <form>
            <h1>Preencha os dados para criar sua conta</h1>
            
            <label class="destaque">
                <img class="logo" src="img/email.png" alt="logo email">
                <div>
                    <h2 class="titulo">Adicione seu e-mail</h2>
                    <p class="descricao">Você vai receber infomações sobre a sua conta.</p>
                </div>
                <button>Adicionar</button>
            </label>
            <label class="opcao">
            <img src="" alt="escolha seu nome">
            <div>
                <h2 class="titulo">Escolha seu nome</h2>
                <p class="descricao">conte-nos como você quer que te chamemos.</p>
            </div>
            </label>
            <label class="opcao">
            <img src="" alt="numero de telefone">
            <div>
                <h2 class="titulo">Valide seu telefone</h2>
                <p class="descricao">Você vai poder usá-lo para acessar sua conta.</p>
            </div>
            </label>
            <label class="opcao">
                <img src="" alt="cire sua senha">
                <div>
                <h2 class="titulo">Crie sua senha</h2>
                <p class="descricao">Para manter sua conta protegida.</p>
                </div>
            </label>


        </form>
    </body>
</html>
